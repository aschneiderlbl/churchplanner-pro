<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Static, clickable replica of the ChurchPlannerPro admin app: every screen, tab and modal, rebuilt from the live UI.">
<style>
:root{color-scheme:light}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>ChurchPlannerPro Admin Replica</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* ===== tokens sampled from the live app (Tailwind slate + green-600) ===== */
:root{
  --slate-50:#F8FAFC; --slate-100:#F1F5F9; --slate-200:#E2E8F0; --slate-300:#CBD5E1;
  --slate-400:#94A3B8; --slate-500:#64748B; --slate-600:#475569; --slate-700:#334155; --slate-800:#1E293B;
  --gray-300:#D1D5DB;
  --green-600:#16A34A; --green-700:#15803D; --green-100:#DCFCE7; --green-800:#166534;
  --red-600:#DC2626; --red-100:#FEE2E2; --red-700:#B91C1C;
  --amber-100:#FEF3C7; --amber-800:#92400E; --amber-50:#FFFBEB; --amber-400:#FBBF24;
  --blue-link:#0000EE;
  --violet-100:#EDE9FE; --violet-700:#6D28D9;
  --font:'Inter',-apple-system,system-ui,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:#0B1220;color:var(--slate-800);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit}

/* ===== replica chrome (not part of the app) ===== */
.wrap{height:100dvh;min-height:520px;display:flex;flex-direction:column}
.strip{
  flex:none;display:flex;align-items:center;gap:12px;padding:0 14px;height:44px;
  background:#0B1220;color:#94A3B8;font-size:12px;border-bottom:1px solid #1E293B;
}
.strip .dot{width:9px;height:9px;border-radius:50%;background:#EF4444;box-shadow:14px 0 0 #F59E0B,28px 0 0 #22C55E;margin-right:30px;flex:none}
.strip .url{
  flex:1;min-width:0;font-family:var(--mono);font-size:11.5px;background:#111C2E;border:1px solid #1E293B;
  border-radius:7px;padding:5px 11px;color:#93C5A6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.strip .tag{flex:none;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:#64748B;display:none}
@media(min-width:760px){.strip .tag{display:block}}
.notes-toggle{
  flex:none;display:inline-flex;align-items:center;gap:7px;background:#111C2E;border:1px solid #1E293B;color:#94A3B8;
  border-radius:999px;padding:5px 12px 5px 8px;font-size:11.5px;cursor:pointer;white-space:nowrap;
}
.notes-toggle .sw{width:26px;height:15px;border-radius:999px;background:#334155;position:relative;transition:background .15s}
.notes-toggle .sw::after{content:"";position:absolute;top:2px;left:2px;width:11px;height:11px;border-radius:50%;background:#94A3B8;transition:transform .15s,background .15s}
.notes-toggle[aria-pressed="true"]{color:var(--amber-400);border-color:#3F3016}
.notes-toggle[aria-pressed="true"] .sw{background:#78350F}
.notes-toggle[aria-pressed="true"] .sw::after{transform:translateX(11px);background:var(--amber-400)}

/* ===== the app ===== */
.app{flex:1;min-height:0;display:flex;background:var(--slate-50);overflow:hidden}
aside{
  flex:none;width:260px;background:var(--slate-800);color:var(--slate-200);
  display:flex;flex-direction:column;overflow:hidden;
}
.brand{flex:none;padding:20px 20px 16px;font-size:15px;font-weight:700;color:#fff;letter-spacing:-.01em}
aside nav{flex:1;overflow-y:auto;padding:0 12px 12px;display:flex;flex-direction:column;gap:2px}
aside nav a{
  display:flex;align-items:center;gap:10px;padding:10px 16px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--slate-200);text-decoration:none;cursor:pointer;
}
aside nav a:hover{background:rgba(255,255,255,.06)}
aside nav a.on{background:rgba(255,255,255,.1);color:#fff}
aside nav a .ic{font-size:14px;width:18px;text-align:center;flex:none}
aside nav a.child{padding-left:30px;font-size:13px;color:var(--slate-300)}
.navdiv{margin:16px 6px 8px;font-size:10.5px;letter-spacing:.12em;color:var(--slate-500);text-align:center;font-weight:600}
.badge{margin-left:auto;font-size:10px;font-weight:600;letter-spacing:.02em;padding:2px 6px;border-radius:5px;background:rgba(255,255,255,.12);color:#CBD5E1}
.badge.new{background:transparent;color:var(--slate-400);padding:0}
.church{flex:none;border-top:1px solid rgba(255,255,255,.1);padding:14px 20px;display:flex;align-items:center;gap:10px}
.church .sq{width:26px;height:26px;border-radius:7px;background:var(--green-600);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.church b{display:block;font-size:13px;font-weight:600;color:#fff}
.church span{display:block;font-size:11.5px;color:var(--slate-400)}

.col{flex:1;min-width:0;display:flex;flex-direction:column}
header.topbar{
  flex:none;height:64px;background:#fff;border-bottom:1px solid var(--slate-200);
  display:flex;align-items:center;gap:12px;padding:0 32px;
}
header.topbar h2{margin:0;font-size:18px;font-weight:600;letter-spacing:-.01em}
.acct{margin-left:auto;display:flex;align-items:center;gap:10px}
.acct .av{width:26px;height:26px;border-radius:50%;background:var(--green-600);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center}
.acct .em{font-size:13px;color:var(--slate-600)}
.acct .out{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--slate-800);font-size:14px;cursor:pointer;padding:0}
.hamb{display:none;background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--slate-800);padding:0 4px}

main{flex:1;min-width:0;overflow-y:auto;padding:32px}
h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.pagehead{display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px}
.pagehead .acts{margin-left:auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sub{margin:6px 0 0;font-size:14px;color:var(--slate-500)}

/* controls */
.btn{border:0;border-radius:8px;font-size:14px;font-weight:600;padding:10px 18px;cursor:pointer;background:transparent;color:var(--slate-800);white-space:nowrap}
.btn.primary{background:var(--green-600);color:#fff}
.btn.primary:hover{background:var(--green-700)}
.btn.ghost:hover{background:var(--slate-100)}
.btn.outline{border:1px solid var(--slate-300);background:#fff}
.btn.sm{font-size:13px;padding:7px 13px}
.btn.link{padding:0;font-weight:600;font-size:13px;color:var(--slate-800)}
.btn.danger{color:var(--red-600)}
input[type=text],input[type=email],input[type=tel],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;background:#fff;border:1px solid var(--gray-300);border-radius:8px;
  font-family:inherit;font-size:14px;padding:10px 14px;color:var(--slate-800);
}
textarea{min-height:100px;resize:vertical}
label.fl{display:block;font-size:13px;font-weight:600;margin-bottom:6px}
.help{font-size:12px;color:var(--slate-500);margin:6px 0 0}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:560px){.fgrid{grid-template-columns:1fr}}
.fgrid .full{grid-column:1/-1}

/* tabs — inactive ones are unstyled links in the real app */
.tabbar{display:flex;gap:4px;border-bottom:1px solid var(--slate-200);margin:20px 0 24px;overflow-x:auto}
.tabbar a{padding:12px 20px;font-size:14px;font-weight:500;color:var(--blue-link);text-decoration:underline;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabbar a.on{color:var(--green-600);text-decoration:none;border-bottom-color:var(--green-600)}

/* surfaces */
.card{background:#fff;border:1px solid var(--slate-200);border-radius:12px}
.card.pad{padding:20px 24px}
.cardtitle{font-size:15px;font-weight:600;margin:0 0 14px}
.empty{padding:24px 32px;color:var(--slate-500);font-size:14px;text-align:center}
.emptybar{background:#fff;border:1px solid var(--slate-200);border-radius:10px;padding:14px 18px;font-size:14px;color:var(--slate-600)}

/* tables */
.tablewrap{background:#fff;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:560px}
th{background:var(--slate-50);font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;text-align:left;padding:14px 20px;border-bottom:1px solid var(--slate-200);color:var(--slate-800)}
td{font-size:14px;padding:16px 20px;border-bottom:1px solid var(--slate-200);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
.num{font-variant-numeric:tabular-nums}
.linky{color:var(--blue-link);text-decoration:underline;cursor:pointer}

/* pills */
.pill{display:inline-block;border-radius:999px;font-size:12px;font-weight:600;padding:4px 10px}
.pill.green{background:var(--green-100);color:var(--green-800)}
.pill.amber{background:var(--amber-100);color:var(--amber-800)}
.pill.slate{background:var(--slate-100);color:var(--slate-600)}
.pill.violet{background:var(--violet-100);color:var(--violet-700)}
.pill.red{background:var(--red-100);color:var(--red-700)}
.status-ok{color:var(--green-600);font-weight:600;font-size:13px}
.muted{color:var(--slate-500)}
.tiny{font-size:12px}

/* stat tiles */
.tiles{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));margin-bottom:16px}
.tile{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:20px 22px}
.tile .v{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.tile .k{font-size:13px;color:var(--slate-500);margin-top:6px}
.tile .v.pos{color:var(--green-600)} .tile .v.neg{color:var(--red-600)}

/* people split */
.split{display:grid;grid-template-columns:300px 1fr;background:#fff;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden;min-height:520px}
@media(max-width:720px){.split{grid-template-columns:1fr}.split .detail{border-left:0;border-top:1px solid var(--slate-200)}}
.split .list{border-right:1px solid var(--slate-200);display:flex;flex-direction:column;min-height:0}
.split .list .search{padding:10px 12px;border-bottom:1px solid var(--slate-200)}
.split .list .search input{border:0;padding:6px 4px;font-size:14px}
.split .list .search input:focus{outline:none}
.split .list .rows{overflow-y:auto;max-height:560px}
.prow{display:flex;align-items:center;gap:12px;padding:12px 16px;cursor:pointer;border:0;background:none;width:100%;text-align:left}
.prow:hover{background:var(--slate-50)}
.prow.on{background:#EFF6F1}
.av{width:36px;height:36px;border-radius:50%;background:var(--green-600);color:#fff;font-size:12px;font-weight:600;display:grid;place-items:center;flex:none}
.prow .pmeta{min-width:0;flex:1}
.prow .nm{display:block;font-size:14px;font-weight:500;line-height:1.3}
.prow .sb{display:block;font-size:12px;color:var(--slate-500);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.detail{padding:24px 32px}
.dhead{display:flex;align-items:center;gap:14px;margin-bottom:26px}
.dhead .av{width:44px;height:44px;font-size:14px}
.dhead h3{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.dhead .sb{font-size:13px;color:var(--slate-500)}
.dhead .acts{margin-left:auto;display:flex;gap:14px}
.seclabel{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--slate-500);padding-bottom:8px;border-bottom:1px solid var(--slate-200);margin:0 0 14px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px 40px;margin-bottom:26px}
@media(max-width:560px){.kv{grid-template-columns:1fr}}
.kv .row{display:flex;justify-content:space-between;gap:16px;font-size:13px}
.kv .row .k{color:var(--slate-500)}
.notefield{background:var(--amber-50);border-left:3px solid var(--amber-400);border-radius:0 6px 6px 0;min-height:30px;padding:6px 12px;font-size:13px;color:var(--slate-600)}

/* group cards */
.gcards{display:grid;gap:16px;grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:760px){.gcards{grid-template-columns:1fr}}
.gcards.loose{display:flex;flex-wrap:wrap}
.gcards.loose .gcard{flex:0 1 250px}
.gcard{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:18px 20px}
.gcard h4{margin:0 0 4px;font-size:15px;font-weight:600}
.gcard .cnt{font-size:13px;color:var(--slate-500);margin:0 0 14px;padding-bottom:14px;border-bottom:1px solid var(--slate-200)}
.chk{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.chk input{width:14px;height:14px;accent-color:var(--green-600);margin:0}
.gcard .acts{display:flex;gap:10px;margin-top:12px}

/* volunteers */
.vgrid{background:#fff;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden}
.vgrid table{min-width:820px}
.vgrid th{text-align:center;padding:10px}
.vgrid th:first-child{text-align:left}
.vgrid th .d{display:block;font-size:17px;font-weight:700;letter-spacing:-.02em;text-transform:none;margin-top:2px}
.vgrid td{padding:8px;border-right:1px solid var(--slate-200);vertical-align:top;min-height:80px}
.vgrid td:last-child{border-right:0}
.vgrid td.grp{font-size:13px;font-weight:500;border-left:3px solid var(--green-600);padding-left:14px;vertical-align:middle;white-space:nowrap}
.shift{background:#F0FDF4;border:1px solid #BBF7D0;border-radius:7px;padding:7px 9px;margin-bottom:6px;cursor:pointer}
.shift b{display:block;font-size:12px;font-weight:600}
.shift i{display:block;font-size:10.5px;color:var(--slate-500);font-style:normal}
.shift em{display:block;font-size:10.5px;color:var(--green-700);font-style:normal;font-weight:600}

/* calendar */
.cal{background:#fff;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden}
.calbar{display:flex;align-items:center;gap:10px;padding:14px 16px;flex-wrap:wrap}
.calbar .mid{flex:1;text-align:center;font-size:22px;font-weight:700;letter-spacing:-.02em;min-width:180px}
.calbtn{border:1px solid var(--slate-300);background:#fff;border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer}
.calbtn.on{background:var(--slate-800);color:#fff;border-color:var(--slate-800)}
.calgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--slate-200);min-width:700px}
.calgrid .dow{font-size:12px;font-weight:600;color:var(--slate-500);text-align:center;padding:8px 4px;border-bottom:1px solid var(--slate-200);background:var(--slate-50)}
.cell{border-right:1px solid var(--slate-200);border-bottom:1px solid var(--slate-200);min-height:86px;padding:4px}
.cell:nth-child(7n+7){border-right:0}
.cell .dn{font-size:11px;color:var(--slate-500);text-align:right;padding:0 3px 3px}
.cell.out .dn{color:var(--slate-300)}
.ev{display:flex;gap:5px;font-size:10.5px;background:#F0FDF4;border-left:2px solid var(--green-600);border-radius:0 4px 4px 0;padding:2px 4px;margin-bottom:2px;cursor:pointer;line-height:1.35}
.ev .t{color:var(--slate-500);flex:none}
.ev .n{font-weight:600;color:var(--green-800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend{display:flex;gap:18px;padding:12px 16px;font-size:12px;color:var(--slate-600);flex-wrap:wrap}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:6px}

/* bars */
.bars{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;align-items:end;height:160px;margin-top:10px}
.bars .b{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:0}
.bars .b .fill{background:var(--green-600);border-radius:3px 3px 0 0;min-height:3px}
.bars .b .fill.zero{background:var(--slate-200)}
.barlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:8px;margin-top:6px;text-align:center}
.barlabels div{font-size:10px;color:var(--slate-500)}
.barlabels div b{display:block;font-size:11px;color:var(--slate-700);font-weight:600}

/* chat */
.chatwrap{display:grid;grid-template-columns:230px 1fr;gap:16px}
@media(max-width:720px){.chatwrap{grid-template-columns:1fr}}
.qa{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.qa button{background:#fff;border:1px solid var(--slate-200);border-radius:9px;padding:10px 14px;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.hist{background:#fff;border:1px solid var(--slate-200);border-radius:12px;overflow:hidden}
.hist .hh{display:flex;align-items:center;padding:10px 14px;border-bottom:1px solid var(--slate-200)}
.hist .hh b{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--slate-500)}
.hist .hh span{margin-left:auto;font-size:12px;color:var(--green-600);font-weight:600;cursor:pointer}
.hist .hi{padding:9px 14px;border-bottom:1px solid var(--slate-100);cursor:pointer}
.hist .hi:hover{background:var(--slate-50)}
.hist .hi b{display:block;font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist .hi span{font-size:11px;color:var(--slate-400)}
.thread{background:#fff;border:1px solid var(--slate-200);border-radius:12px;padding:18px;display:flex;flex-direction:column;min-height:330px}
.msg{display:flex;gap:10px;align-items:flex-start}
.msg .bub{background:var(--slate-50);border:1px solid var(--slate-200);border-radius:10px;padding:11px 14px;font-size:13.5px;max-width:62ch}
.composer{margin-top:auto;display:flex;gap:10px;padding-top:16px}
.composer input{flex:1}
.send{background:var(--green-600);border:0;border-radius:8px;color:#fff;width:44px;display:grid;place-items:center;cursor:pointer;font-size:15px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:32px 16px;overflow-y:auto;z-index:50}
.modal{background:#fff;border-radius:12px;box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1);width:500px;max-width:100%;margin:auto}
.modal.wide{width:620px}
.modal .mh{display:flex;align-items:center;padding:20px 24px 0}
.modal .mh h3{margin:0;font-size:18px;font-weight:600}
.modal .mh button{margin-left:auto;background:none;border:0;font-size:18px;color:var(--slate-400);cursor:pointer;line-height:1}
.modal .mb{padding:20px 24px;display:flex;flex-direction:column;gap:16px}
.modal .mf{display:flex;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid var(--slate-200)}
.subhead{font-size:15px;font-weight:600;margin:6px 0 0;padding-top:16px;border-top:1px solid var(--slate-200)}
.callout{background:#EFF6F1;border:1px solid #BBF7D0;border-radius:9px;padding:12px 14px;font-size:12.5px;color:var(--slate-600)}
.drop{border:2px dashed var(--slate-300);border-radius:10px;padding:34px;text-align:center;color:var(--slate-500);font-size:13.5px}
.drop .big{font-size:26px;display:block;margin-bottom:8px;filter:grayscale(1);opacity:.6}

/* annotations */
.note{display:none;background:var(--amber-50);border:1px solid #FDE68A;border-left:3px solid var(--amber-400);border-radius:0 8px 8px 0;padding:10px 14px;font-size:12.5px;color:#78350F;margin:12px 0}
.note b{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:3px}
.note code{font-family:var(--mono);font-size:11.5px;background:#FDE68A;border-radius:3px;padding:1px 4px}
body.notes .note{display:block}
.route-chip{font-family:var(--mono);font-size:11px;color:var(--slate-500)}

@media(max-width:860px){
  aside{position:absolute;z-index:40;height:100%;transform:translateX(-100%);transition:transform .2s}
  aside.open{transform:none}
  .app{position:relative}
  .hamb{display:block}
  .acct .em{display:none}
  header.topbar{padding:0 16px}
  main{padding:20px 16px}
  h1{font-size:26px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--green-600);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">

/* ---- Calendar ---- */
function calCells(){
  // September 2026 grid, starting Sunday Aug 30
  const out=[];
  for(let i=0;i<42;i++){
    const offset = i-1;                       // cell 0 = Aug 30
    const d = new Date(2026,7,30+i);
    const dom = d.getDate(), mon = d.getMonth(), dow = d.getDay();
    const evs = EVENTS.filter(e=>e.daily||e.dow===dow)
      .sort((a,b)=>a.name.localeCompare(b.name))
      .sort((a,b)=>({'8a':0,'12p':1,'3p':2,'5p':3,'8p':4})[a.time]-({'8a':0,'12p':1,'3p':2,'5p':3,'8p':4})[b.time]);
    out.push(`<div class="cell ${mon!==8?'out':''}"><div class="dn">${dom}</div>
      ${evs.map(e=>`<div class="ev" data-go="/admin/calendar/events/17"><span class="t">${e.time}</span><span class="n">${esc(e.name)}</span></div>`).join('')}</div>`);
    if(i===41) break;
  }
  return out.join('');
}

function openModal(name){
  const m = M[name]; if(!m) return;
  const d = m();
  const ov = $('#overlay');
  ov.className='overlay';
  ov.innerHTML = `<div class="modal${d.wide?' wide':''}" role="dialog" aria-modal="true" aria-label="${esc(d.title)}">
    <div class="mh"><h3>${d.title}</h3><button data-close aria-label="Close">×</button></div>
    <div class="mb">${d.body}</div><div class="mf">${d.foot}</div></div>`;
  ov.hidden = false;
}
function closeModal(){ const ov=$('#overlay'); ov.hidden=true; ov.innerHTML=''; }

/* =========================== render =========================== */
function render(){
  renderNav();
  $('#ptitle').textContent = titleFor(state.route);
  $('#urlbar').textContent = 'churchplannerpro.com' + state.route +
    (state.route==='/admin/finances' && state.tab && state.tab!=='bank' ? '?tab='+state.tab : '');
  const fn = S[state.route];
  $('#screen').innerHTML = fn ? fn() : `<h1>${titleFor(state.route)}</h1><p class="sub">Screen not captured.</p>`;
}

document.addEventListener('click', e => {
  const close = e.target.closest('[data-close]');
  if(close){ closeModal(); return; }
  if(e.target.id==='overlay'){ closeModal(); return; }
  const mod = e.target.closest('[data-modal]');
  if(mod){ openModal(mod.dataset.modal); return; }
  const tab = e.target.closest('[data-tab]');
  if(tab){ state.tab = tab.dataset.tab; render(); return; }
  const g = e.target.closest('[data-go]');
  if(g){ state.tab=null; go(g.dataset.go); return; }
  const row = e.target.closest('[data-m]');
  if(row){ state.member = +row.dataset.m; render(); return; }
  if(e.target.id==='hamb'){ $('#side').classList.toggle('open'); }
});

document.addEventListener('input', e => {
  if(e.target.id==='msearch'){
    const q = e.target.value.toLowerCase();
    [...document.querySelectorAll('#mrows .prow')].forEach(r=>{
      r.style.display = r.textContent.toLowerCase().includes(q) ? '' : 'none';
    });
  }
});
document.addEventListener('keydown', e => { if(e.key==='Escape') closeModal(); });

$('#ntog').addEventListener('click', e => {
  const on = document.body.classList.toggle('notes');
  e.currentTarget.setAttribute('aria-pressed', on ? 'true':'false');
});

render();
</script>
