<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
<title>ChurchPlannerPro Member App</title>
<style>
  /* ============================================================
     REPLICA CHROME  (prefix rx-) — not part of the real product
     ============================================================ */
  html, body { height: 100%; }
  body {
    margin: 0;
    background: #0f172a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .rx-bar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    z-index: 100;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 8px 16px;
    background: #0f172a;
    color: #cbd5e1;
    font-size: 12px;
    border-bottom: 1px solid #1e293b;
  }
  .rx-bar-title { font-weight: 700; color: #fff; letter-spacing: -0.01em; font-size: 12.5px; }
  .rx-tag {
    font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase;
    background: #12603A; color: #d1fae5; padding: 2px 7px; border-radius: 999px;
  }
  .rx-route {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; color: #94a3b8; background: #1e293b;
    padding: 3px 8px; border-radius: 5px; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; max-width: 100%;
  }
  .rx-spacer { flex: 1 1 auto; }
  .rx-controls { display: flex; gap: 6px; flex-shrink: 0; }
  .rx-btn {
    font: inherit; font-size: 11.5px; font-weight: 600;
    background: #1e293b; color: #cbd5e1; border: 1px solid #334155;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .rx-btn:hover { background: #334155; color: #fff; }
  .rx-btn[aria-pressed="true"] { background: #12603A; border-color: #15803d; color: #ecfdf5; }
  .rx-btn:focus-visible, .rx-notes a:focus-visible { outline: 2px solid #4ade80; outline-offset: 2px; }

  .rx-stage {
    padding: 0;
    background: #0f172a;
  }
  .rx-frame {
    background: #f8fafc;
    margin: 0 auto;
    min-height: calc(100vh - 42px);
    transition: max-width 0.25s ease;
  }
  body[data-view="mobile"] .rx-stage { padding: 20px 16px 40px; }
  body[data-view="mobile"] .rx-frame { min-height: 70vh; }
  body[data-view="mobile"] .rx-frame {
    max-width: 390px;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    container-type: inline-size;
  }

  .rx-notes {
    display: none;
    background: #0b1220;
    border-top: 1px solid #1e293b;
    color: #94a3b8;
    font-size: 12.5px;
    line-height: 1.55;
    padding: 16px;
  }
  body[data-notes="on"] .rx-notes { display: block; }
  .rx-notes-inner { max-width: 960px; margin: 0 auto; }
  .rx-notes h3 {
    margin: 0 0 8px; font-size: 11px; text-transform: uppercase;
    letter-spacing: 0.08em; color: #64748b; font-weight: 700;
  }
  .rx-notes ul { margin: 0; padding-left: 18px; }
  .rx-notes li { margin-bottom: 5px; }
  .rx-notes code {
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 11.5px; color: #86efac; background: #142032; padding: 1px 5px; border-radius: 4px;
  }
  .rx-notes strong { color: #e2e8f0; }

  /* ============================================================
     PRODUCT STYLES — transcribed from member.css + page styles
     on churchplannerpro.com (captured 2026-09-19)
     ============================================================ */
  .app {
    --color-surface: #ffffff;
    --color-bg: #f8fafc;
    --color-border: #e2e8f0;
    --color-text: #1e293b;
    --color-text-muted: #64748b;
    --color-primary: #12603A;
    --color-primary-hover: #0F5231;
    --color-primary-soft: #f0fdf4;
    --color-danger: #dc2626;
    --color-danger-soft: #fef2f2;
    --color-success: #16a34a;
    --color-success-soft: #f0fdf4;
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06);
    --radius: 10px;
    --radius-sm: 6px;
    background: var(--color-bg);
    color: var(--color-text);
    line-height: 1.5;
    font-size: 16px;
  }

  /* --- nav --- */
  .member-nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.875rem 1.5rem;
    background: var(--color-surface);
    border-bottom: 1px solid var(--color-border);
    box-shadow: var(--shadow-sm);
    position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10;
  }
  .member-nav-brand { font-weight: 700; font-size: 1.05rem; color: var(--color-primary); letter-spacing: -0.01em; }
  .member-nav-links { display: flex; gap: 1.25rem; flex: 1; margin-left: 2rem; }
  .member-nav-links a {
    color: var(--color-text-muted); text-decoration: none; font-weight: 500; font-size: 0.95rem;
    padding: 0.375rem 0.5rem; border-radius: var(--radius-sm); transition: color .15s, background .15s;
    white-space: nowrap;
  }
  .member-nav-links a:hover { color: var(--color-text); background: var(--color-bg); }
  .member-nav-links a.active { color: var(--color-primary); background: var(--color-primary-soft); }
  .member-nav-user {
    display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem;
    color: var(--color-text-muted); white-space: nowrap; flex-shrink: 0;
  }
  .nav-badge {
    display: inline-block; min-width: 18px; padding: 1px 6px; border-radius: 9px;
    background: #dc2626; color: #fff; font-size: 0.7rem; font-weight: 700;
    text-align: center; line-height: 1.2;
  }
  .btn-link {
    background: none; border: none; color: var(--color-primary); cursor: pointer;
    font-family: inherit; font-size: 0.9rem; font-weight: 500;
    padding: 0.25rem 0.5rem; border-radius: var(--radius-sm);
  }
  .btn-link:hover { background: var(--color-primary-soft); }

  /* --- page shell --- */
  .member-main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }
  .page-header { margin-bottom: 2rem; }
  .page-header h1, .page-title {
    margin: 0 0 0.25rem; font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em;
  }
  .page-subtitle { margin: 0; color: var(--color-text-muted); font-size: 1rem; }
  .page-header-with-action {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 1rem; margin-bottom: 2rem;
  }
  .section-label {
    font-size: 12px; font-weight: 600; color: var(--color-text-muted);
    text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 0.5rem;
  }

  /* --- cards --- */
  .card-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 1.25rem; align-items: start; }
  .card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 1.25rem; box-shadow: var(--shadow-sm);
  }
  .card h2 { margin: 0 0 1rem; font-size: 1.125rem; font-weight: 600; color: var(--color-text); }
  .card-footer-link { margin: 1rem 0 0; font-size: 0.9rem; }
  .card-footer-link a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
  .card-footer-link a:hover { text-decoration: underline; }
  .empty-state { color: var(--color-text-muted); font-size: 0.95rem; margin: 0; padding: 0.5rem 0; }

  /* --- event / form lists --- */
  .event-list, .form-list, .campaign-list { list-style: none; margin: 0; padding: 0; }
  .event-list li, .form-list li, .campaign-list li { padding: 0.75rem 0; border-bottom: 1px solid var(--color-border); }
  .event-list li:last-child, .form-list li:last-child, .campaign-list li:last-child { border-bottom: none; }
  .event-title { font-weight: 600; color: var(--color-text); margin-bottom: 0.125rem; }
  .event-meta { font-size: 0.875rem; color: var(--color-primary); font-weight: 500; }
  .event-location { font-size: 0.875rem; color: var(--color-text-muted); margin-top: 0.125rem; }
  .event-description { font-size: 0.9rem; color: var(--color-text-muted); margin-top: 0.375rem; }
  .form-list li { font-size: 0.95rem; }
  .form-list a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
  .form-list a:hover { text-decoration: underline; }

  /* --- forms --- */
  .form-field { margin-bottom: 1.25rem; }
  .form-field label { display: block; font-weight: 500; font-size: 0.9rem; color: var(--color-text); margin-bottom: 0.375rem; }
  .form-field input[type="text"], .form-field input[type="email"], .form-field textarea, .form-field select {
    display: block; width: 100%; box-sizing: border-box;
    padding: 0.625rem 0.875rem; font-size: 0.95rem; font-family: inherit;
    border: 1px solid var(--color-border); border-radius: var(--radius-sm);
    background: var(--color-surface); color: var(--color-text);
  }
  .form-field textarea { min-height: 100px; resize: vertical; }
  .form-field input:focus, .form-field textarea:focus, .form-field select:focus {
    outline: none; border-color: var(--color-primary);
    box-shadow: 0 0 0 3px var(--color-primary-soft);
  }
  .field-required { color: var(--color-danger); margin-left: 0.25rem; }
  .field-help { font-size: 0.875rem; color: var(--color-text-muted); margin: 0.375rem 0 0; }
  .form-error {
    background: var(--color-danger-soft); color: var(--color-danger);
    padding: 0.75rem 1rem; border-radius: var(--radius-sm);
    margin-bottom: 1.25rem; font-size: 0.95rem;
  }

  /* --- buttons --- */
  button, .btn { cursor: pointer; font-family: inherit; }
  .btn-primary {
    display: inline-block; background: var(--color-primary); color: #fff; border: none;
    padding: 0.625rem 1.25rem; border-radius: var(--radius-sm);
    font-size: 0.95rem; font-weight: 600; text-decoration: none; transition: background .15s;
  }
  .btn-primary:hover { background: var(--color-primary-hover); }
  .btn-secondary {
    display: inline-block; background: #f8fafc; color: var(--color-text);
    border: 1px solid var(--color-border); border-radius: 8px;
    font-size: 13px; font-weight: 600; padding: 7px 14px; text-decoration: none;
  }
  .btn-secondary:hover { background: #eef2f7; }
  .btn-sm { font-size: 13px; padding: 5px 12px; }
  .btn-primary.btn-sm { padding: 6px 14px; font-size: 13px; border-radius: 6px; }
  .actions-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .form-select {
    font-family: inherit; font-size: 14px; padding: 8px 12px;
    border: 1px solid #d1d5db; border-radius: 8px; background: #fff; color: #111827;
  }

  /* --- thanks --- */
  .thanks-card {
    background: var(--color-surface); border: 1px solid var(--color-border);
    border-radius: var(--radius); padding: 2.5rem; text-align: center; box-shadow: var(--shadow-sm);
  }
  .thanks-card h1 { margin: 0 0 0.75rem; color: var(--color-success); font-size: 1.75rem; }
  .thanks-card p { margin: 0.5rem 0; color: var(--color-text-muted); }
  .thanks-card a { color: var(--color-primary); text-decoration: none; font-weight: 500; }
  .thanks-card a:hover { text-decoration: underline; }

  /* --- campaigns --- */
  .campaign-list li.card { border-radius: var(--radius); padding: 1.25rem; margin-bottom: 0.875rem; }
  .campaign-list a { color: var(--color-primary); text-decoration: none; font-weight: 600; font-size: 1rem; }
  .campaign-list a:hover { text-decoration: underline; }
  .campaign-need { margin: 0.375rem 0 0.75rem; font-size: 0.9rem; color: var(--color-text-muted); line-height: 1.4; }
  .campaign-progress { height: 8px; background: var(--color-bg); border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
  .campaign-progress-bar { height: 100%; background: var(--color-primary); border-radius: 4px; transition: width .3s; }
  .campaign-amounts { display: flex; justify-content: space-between; font-size: 0.85rem; margin: 0.375rem 0 1rem; }
  .campaign-raised { font-weight: 600; color: var(--color-text); }
  .campaign-goal { color: var(--color-text-muted); }

  /* --- register --- */
  .register-section-count {
    display: inline-block; background: #e5e7eb; color: #374151;
    font-size: 0.85rem; font-weight: 600; padding: 2px 10px;
    border-radius: 999px; margin-left: 8px; vertical-align: middle;
  }
  .register-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .register-row {
    display: flex; align-items: center; justify-content: space-between;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 12px 16px;
  }
  .register-row-title { font-weight: 600; color: #111827; }
  .register-row-meta { color: #6b7280; font-size: 0.85rem; margin-top: 2px; }
  .register-heading { font-size: 1.125rem; font-weight: 700; margin: 1.5rem 0 0.75rem; }

  /* --- attendance --- */
  .attendance-pick-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 8px; }
  .attendance-pick-row {
    display: flex; align-items: center; gap: 12px;
    background: #fff; border: 1px solid #e5e7eb; border-radius: 8px;
    padding: 12px 16px; cursor: pointer;
  }
  .attendance-pick-row:hover { background: #f9fafb; }
  .attendance-pick-row input[type="checkbox"] { width: auto; }

  /* --- volunteer --- */
  .vol-page { padding: 24px 0; max-width: 720px; }
  .vol-page > h1 { margin: 0; font-size: 1.875rem; font-weight: 700; letter-spacing: -0.02em; }
  .vol-section { margin-top: 24px; }
  .vol-section h2 { font-size: 16px; font-weight: 700; margin: 0 0 12px; }
  .vol-list { display: flex; flex-direction: column; gap: 8px; }
  .vol-card {
    padding: 12px 16px; border: 1px solid #e4e8ee; border-radius: 8px;
    background: #fff; box-shadow: 0 1px 2px rgba(16,24,40,.06);
  }
  .vol-card-open { border-color: #bbf7d0; background: linear-gradient(180deg, #f7fdf9, #fff); }
  .vol-card-meta { font-size: 12px; color: #6b7686; margin-bottom: 4px; }
  .vol-card-title { font-size: 15px; font-weight: 700; }
  .vol-card-sub { font-size: 12px; color: #6b7686; margin-top: 2px; }
  .vol-card .actions-row { margin-top: 10px; }
  .muted { color: #6b7686; }

  /* --- tables --- */
  .table-container { overflow-x: auto; }
  .app table {
    width: 100%; border-collapse: collapse; background: #fff;
    border: 1px solid var(--color-border); border-radius: var(--radius); overflow: hidden;
  }
  .app th {
    font-size: 12px; font-weight: 600; color: var(--color-text-muted);
    text-transform: uppercase; letter-spacing: 0.04em; text-align: left;
    padding: 12px 16px; border-bottom: 1px solid var(--color-border); background: #fcfdfe;
  }
  .app td { font-size: 16px; font-weight: 500; padding: 12px 16px; border-bottom: 1px solid var(--color-border); }
  .app tbody tr:last-child td { border-bottom: none; }
  .app th:last-child, .app td:last-child { text-align: right; }
  .panel-empty {
    background: #fff; border: 1px solid var(--color-border); border-radius: var(--radius);
    padding: 1.5rem; text-align: center; color: var(--color-text-muted); font-size: 0.95rem;
    box-shadow: var(--shadow-sm);
  }
  .inline-empty { color: var(--color-text-muted); font-size: 0.95rem; }
  .inline-empty a { color: var(--color-primary); font-weight: 500; }
  .empty-block { text-align: left; }
  .empty-block h2 { font-size: 1.05rem; font-weight: 700; margin: 0 0 0.35rem; }
  .empty-block p { margin: 0 0 1rem; color: var(--color-text-muted); font-size: 0.9rem; }
  .toast {
    background: var(--color-success-soft); border: 1px solid #bbf7d0; color: #166534;
    padding: 0.75rem 1rem; border-radius: var(--radius-sm); margin-bottom: 1.25rem; font-size: 0.95rem;
  }

  /* --- product responsive rules (max-width: 640px) --- */
  @media (max-width: 640px) {
    .member-nav { flex-wrap: wrap; padding: 0.625rem 0.75rem; gap: 0; }
    .member-nav-brand { font-size: 0.95rem; flex-shrink: 0; }
    .member-nav-links {
      flex: 0 0 100% !important; width: 100% !important; margin-left: 0 !important;
      max-width: 100%; margin-top: 0.5rem; order: 3; overflow-x: auto;
      flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 4px; gap: 1rem;
    }
    .member-nav-links::-webkit-scrollbar { display: none; }
    .member-nav-links a { flex-shrink: 0; white-space: nowrap; }
    .member-nav-user { margin-left: auto; min-width: 0; max-width: 100%; }
    .member-nav-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 140px; min-width: 0; }
    .member-main { padding: 1rem 0.75rem; }
    .card-grid { grid-template-columns: 1fr; }
    .page-header, .page-header-with-action { flex-direction: column; align-items: flex-start; gap: 12px; }
    .actions-row { flex-wrap: wrap; gap: 8px; }
    .btn-primary { min-height: 44px; }
    .app table { max-width: 100%; }
  }
  /* mirror the same breakpoint inside the phone frame */
  @container (max-width: 640px) {
    .member-nav { flex-wrap: wrap; padding: 0.625rem 0.75rem; gap: 0; }
    .member-nav-brand { font-size: 0.95rem; flex-shrink: 0; }
    .member-nav-links {
      flex: 0 0 100% !important; width: 100% !important; margin-left: 0 !important;
      margin-top: 0.5rem; order: 3; overflow-x: auto;
      flex-wrap: nowrap; scrollbar-width: none; padding-bottom: 4px; gap: 1rem;
    }
    .member-nav-links::-webkit-scrollbar { display: none; }
    .member-nav-links a { flex-shrink: 0; white-space: nowrap; }
    .member-nav-user { margin-left: auto; min-width: 0; }
    .member-nav-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 120px; }
    .member-main { padding: 1rem 0.75rem; }
    .card-grid { grid-template-columns: 1fr; }
    .page-header-with-action { flex-direction: column; align-items: flex-start; gap: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }
</style>
</head>

  var app = document.getElementById("app");
  var routeEl = document.getElementById("rx-route");
  var notesBody = document.getElementById("rx-notes-body");

  function activeNav(route) {
    if (route === "/members") return "/members";
    var best = "";
    NAV.forEach(function (n) {
      if (n.route !== "/members" && route.indexOf(n.route) === 0 && n.route.length > best.length) best = n.route;
    });
    if (route.indexOf("/members/forms/") === 0) return "/members/quick-register";
    if (route.indexOf("/members/attendance/") === 0) return "/members/events";
    return best || "/members";
  }

  var current = "/members";

  function render() {
    var route = screens[current] ? current : "/members";
    current = route;

    routeEl.textContent = route;
    document.title = "ChurchPlannerPro Member App";

    app.innerHTML = nav(activeNav(route)) +
      '<main class="member-main">' + flashBlock() + screens[route]() + "</main>";

    var list = notesFor(route);
    notesBody.innerHTML = list
      ? "<h3>Screen notes — " + esc(route) + "</h3><ul>" +
        list.map(function (n) { return "<li>" + n + "</li>"; }).join("") + "</ul>"
      : "<h3>Screen notes</h3><p>No annotations for this screen.</p>";

    var stage = document.querySelector(".rx-stage");
    if (stage) stage.scrollTop = 0;
    window.scrollTo(0, 0);
  }

  function go(route, message) {
    if (message) flash = message;
    current = route;
    render();
  }

  // Route from in-page links. The artifact viewer sandboxes the page, so
  // fragment navigation is not reliable there — intercept and route in JS.
  document.addEventListener("click", function (e) {
    var a = e.target.closest('a[href^="#/"]');
    if (!a) return;
    e.preventDefault();
    go(a.getAttribute("href").slice(1));
  });

  /* ---------------------- interactions ---------------------- */

  app.addEventListener("click", function (e) {
    var el = e.target.closest("[data-act]");
    if (!el) return;
    var act = el.getAttribute("data-act");

    if (act === "signout") {
      e.preventDefault();
      go("/members", "Signed out. (Replica — session is not really ended.)");
    } else if (act === "download") {
      e.preventDefault();
      flash = "Download requested: " + FILES[0].name + " (replica — no file is served).";
      render();
    } else if (act === "drop") {
      e.preventDefault();
      MY_SHIFTS.splice(Number(el.getAttribute("data-i")), 1);
      go("/members/volunteer", "Shift dropped.");
    } else if (act === "swap") {
      e.preventDefault();
      var sel = document.getElementById("swap-" + el.getAttribute("data-i"));
      if (!sel || !sel.value) { flash = "Pick someone to offer the swap to."; render(); return; }
      var name = sel.options[sel.selectedIndex].text;
      go("/members/volunteer", "Swap offered to " + name + ".");
    } else if (act === "claim") {
      e.preventDefault();
      var i = Number(el.getAttribute("data-i"));
      var s = OPEN_SHIFTS.splice(i, 1)[0];
      MY_SHIFTS.push(s);
      NAV[5].badge = OPEN_SHIFTS.length;
      go("/members/volunteer", "You claimed the " + s.role + " shift on " + s.when + ".");
    }
  });

  app.addEventListener("submit", function (e) {
    var form = e.target.closest("[data-form]");
    if (!form) return;
    e.preventDefault();
    var kind = form.getAttribute("data-form");

    if (kind === "inquiry") {
      var subject = document.getElementById("inq-subject").value.trim();
      go("/members/inquiries", subject
        ? "Inquiry sent to staff: “" + subject + "”"
        : "Inquiry sent to staff.");
    } else if (kind === "attendance") {
      var checked = Array.prototype.filter.call(
        form.querySelectorAll('input[type="checkbox"]'), function (c) { return c.checked; });
      go("/members/events", checked.length
        ? "Checked in " + checked.length + (checked.length === 1 ? " person." : " people.")
        : "No one checked in.");
    } else if (kind === "respond") {
      var slug = form.getAttribute("data-slug");
      var f = FORMS.filter(function (x) { return x.slug === slug; })[0];
      var missing = Array.prototype.some.call(
        form.querySelectorAll("[required]"), function (c) { return !c.value.trim(); });
      if (missing) { flash = "Please fill in the required fields."; render(); return; }
      flash = f.title + " submitted.";
      go("/members/forms/thanks");
    }
  });

  /* ---------------------- chrome controls ------------------- */

  var viewBtn = document.getElementById("rx-view");
  viewBtn.addEventListener("click", function () {
    var on = document.body.getAttribute("data-view") === "mobile";
    document.body.setAttribute("data-view", on ? "desktop" : "mobile");
    viewBtn.setAttribute("aria-pressed", on ? "false" : "true");
    viewBtn.textContent = on ? "Phone view" : "Desktop view";
  });

  var notesBtn = document.getElementById("rx-notes-btn");
  notesBtn.addEventListener("click", function () {
    var on = document.body.getAttribute("data-notes") === "on";
    document.body.setAttribute("data-notes", on ? "off" : "on");
    notesBtn.setAttribute("aria-pressed", on ? "false" : "true");
  });

  document.body.setAttribute("data-view", "desktop");
  document.body.setAttribute("data-notes", "off");

  render();
})();
</script>

</body>
</html>
