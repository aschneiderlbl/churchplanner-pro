<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ChurchPlannerPro — unified design system</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#0F172A; --navy-soft:#1E293B; --slate:#334155;
  --bg:#F8FAFC; --bg-soft:#F1F5F9; --surface:#FFFFFF;
  --border:#E5E7EB; --border-strong:#D1D5DB;
  --text:#0F172A; --text-2:#475569; --text-muted:#94A3B8;
  --on-dark:#FFFFFF; --on-dark-muted:#94A3B8;
  --green:#15803D; --green-hover:#166534; --green-tint:#DCFCE7; --green-deep:#166534;
  --indigo:#4F46E5; --indigo-hover:#4338CA; --indigo-tint:#EEF2FF; --indigo-deep:#3730A3;
  --blue:#2563EB; --blue-tint:#DBEAFE; --blue-deep:#1E40AF;
  --amber:#B45309; --amber-tint:#FEF3C7; --amber-deep:#92400E; --amber-dot:#F59E0B;
  --red:#DC2626; --red-tint:#FEE2E2; --red-deep:#991B1B;
  --slate-tint:#F1F5F9; --slate-deep:#334155;
  --r-btn:6px; --r-input:8px; --r-card:12px; --r-modal:14px;
  --sh-sm:0 1px 2px rgba(15,23,42,.04);
  --sh-md:0 4px 12px rgba(15,23,42,.06),0 1px 3px rgba(15,23,42,.04);
  --sh-lg:0 12px 32px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.05);
  --sidebar:250px; --topbar:62px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
svg{display:block}
.ic{width:18px;height:18px;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;fill:none;flex:none}
.ic-sm{width:15px;height:15px}.ic-xl{width:26px;height:26px}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;text-align:left}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px;border-radius:3px}

/* prototype bar */
.proto{position:sticky;top:0;z-index:200;background:#111827;color:#E5E7EB;padding:10px 20px;display:flex;align-items:center;gap:16px;font-size:13px;border-bottom:1px solid #1F2937}
.proto strong{color:#fff;font-weight:600}
.proto .sep{color:#4B5563}
.proto .right{margin-left:auto;font-size:12.5px;color:#9CA3AF}

/* shell */
.app{display:flex}
.side{width:var(--sidebar);flex:none;background:var(--navy);color:var(--on-dark);display:flex;flex-direction:column;position:sticky;top:var(--proto,44px);height:calc(100vh - var(--proto,44px));z-index:80}
.brand{padding:19px 18px 15px;font-size:16.5px;font-weight:700;letter-spacing:-.2px}
.brand em{font-style:normal;font-weight:500;opacity:.72}
.nav{flex:1;overflow-y:auto;padding:0 11px 12px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:#334155;border-radius:3px}
.nav-label{font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--on-dark-muted);padding:12px 9px 5px}
.nav-item{display:flex;align-items:center;gap:11px;padding:8px 9px;border-radius:8px;font-size:14px;font-weight:500;color:var(--on-dark-muted);width:100%;transition:.12s}
.nav-item:hover{background:rgba(30,41,59,.85);color:#E2E8F0}
.nav-item.active{background:var(--navy-soft);color:#fff}
.nav-item.ds{color:#A5B4FC}
.nav-item.ds.active{background:#312E81;color:#fff}
.nav-item .cnt{margin-left:auto;font-size:11px;font-weight:600;background:var(--amber-tint);color:var(--amber-deep);border-radius:999px;padding:1px 7px}
.nav-item .tag{margin-left:auto;font-size:9.5px;font-weight:600;letter-spacing:.05em;background:var(--green-tint);color:var(--green-deep);border-radius:999px;padding:2px 6px}
.side-foot{border-top:1px solid rgba(148,163,184,.16);padding:13px 17px;display:flex;align-items:center;gap:10px}
.avatar{width:31px;height:31px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-size:12.5px;font-weight:600;flex:none}
.avatar.sm{width:26px;height:26px;font-size:10.5px}
.avatar.lg{width:36px;height:36px;font-size:13px}
.side-foot .ch{font-size:13px;font-weight:600;color:#fff}
.side-foot .usr{font-size:11.5px;color:var(--on-dark-muted)}
.main{flex:1;min-width:0}

/* top bar — title lives here, once */
.top{height:var(--topbar);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:18px;padding:0 22px;position:sticky;top:var(--proto,44px);z-index:60}
.top h1{font-size:19.5px;font-weight:700;letter-spacing:-.2px;white-space:nowrap}
.search-top{flex:1;max-width:440px;position:relative}
.search-top .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.search-top input{width:100%;padding:8px 12px 8px 36px;border:1px solid var(--border-strong);border-radius:var(--r-input);font:inherit;font-size:14px;background:var(--bg);color:var(--text)}
.search-top input::placeholder{color:var(--text-muted)}
.search-top input:focus{outline:none;border-color:var(--indigo);background:#fff;box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.top-right{margin-left:auto;display:flex;align-items:center;gap:9px}
.icon-btn{width:34px;height:34px;border-radius:var(--r-btn);display:grid;place-items:center;color:var(--text-2);position:relative}
.icon-btn:hover{background:var(--bg-soft);color:var(--text)}
.dotbadge{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;background:var(--amber-dot);color:#3B2A05;font-size:10px;font-weight:700;display:grid;place-items:center;padding:0 4px;box-shadow:0 0 0 2px #fff}
.acct{display:flex;align-items:center;gap:8px;padding:4px 8px 4px 4px;border-radius:999px}
.acct:hover{background:var(--bg-soft)}
.acct span{font-size:13px;color:var(--text-2)}

/* ===== COMPONENTS ===== */
.content{padding:24px 30px 60px;max-width:1400px}

/* page head: subhead + actions. no second H1. */
.phead{display:flex;align-items:flex-start;gap:24px;margin-bottom:20px}
.phead p{color:var(--text-2);font-size:15px;max-width:64ch}
.phead .acts{margin-left:auto;display:flex;gap:9px;flex:none}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-btn);font-size:14px;font-weight:600;white-space:nowrap;transition:.12s}
.btn-primary{background:var(--green);color:#fff}
.btn-primary:hover{background:var(--green-hover)}
.btn-secondary{background:var(--surface);border:1px solid var(--border-strong);color:var(--text)}
.btn-secondary:hover{background:var(--bg-soft)}
.btn-ghost{color:var(--text-2)}
.btn-ghost:hover{background:var(--bg-soft);color:var(--text)}
.btn-danger{color:var(--red)}
.btn-danger:hover{background:var(--red-tint)}
.btn-sm{padding:6px 11px;font-size:13px}

/* switchers — three components, three jobs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:22px}
.tabs button{padding:10px 14px;font-size:14px;font-weight:600;color:var(--text-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button:hover{color:var(--text)}
.tabs button.on{color:var(--indigo);border-bottom-color:var(--indigo)}
.seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--border-strong);border-radius:var(--r-input);padding:2px;gap:2px}
.seg button{padding:5px 13px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-2)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:var(--sh-sm)}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{padding:5px 12px;border-radius:999px;border:1px solid var(--border-strong);background:#fff;font-size:12.5px;font-weight:500;color:var(--text-2)}
.chip:hover{background:var(--bg-soft)}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* toolbar */
.toolbar{display:flex;align-items:center;gap:11px;margin-bottom:16px;flex-wrap:wrap}
.search{position:relative;width:280px}
.search .ic{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--text-muted)}
.search input{width:100%;padding:8px 12px 8px 34px;border:1px solid var(--border-strong);border-radius:var(--r-input);font:inherit;font-size:14px;background:#fff;color:var(--text)}
.search input::placeholder{color:var(--text-muted)}
.search input:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}

/* badges — one component, six meanings */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;letter-spacing:.02em;padding:3px 9px;border-radius:999px;white-space:nowrap}
.b-live{background:var(--green-tint);color:var(--green-deep)}
.b-draft{background:var(--slate-tint);color:var(--slate-deep)}
.b-attn{background:var(--amber-tint);color:var(--amber-deep)}
.b-info{background:var(--blue-tint);color:var(--blue-deep)}
.b-stop{background:var(--red-tint);color:var(--red-deep)}
.b-done{background:#E2E8F0;color:#334155}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sm)}
.card-pad{padding:20px}
.card-h{padding:16px 20px;border-bottom:1px solid var(--border);font-size:16px;font-weight:600}
.card-f{padding:14px 20px;border-top:1px solid var(--border);background:#FCFDFE;border-radius:0 0 var(--r-card) var(--r-card);display:flex;justify-content:flex-end;gap:9px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fill,minmax(320px,1fr))}
.g3{grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.g4{grid-template-columns:repeat(4,1fr)}

/* stat tiles — max 4, one row */
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:16px 18px;box-shadow:var(--sh-sm)}
.stat .k{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin-bottom:7px}
.stat .v{font-size:27px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .d{font-size:12.5px;margin-top:5px;color:var(--text-muted);font-weight:500}
.stat .d .up{color:var(--green-deep);font-weight:600}
.stat .d .dn{color:var(--red-deep);font-weight:600}

/* tables */
.tblw{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;box-shadow:var(--sh-sm);background:#fff}
table{width:100%;border-collapse:collapse}
thead th{background:var(--bg-soft);font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);padding:10px 15px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}
thead th.num{text-align:right}
tbody td{padding:13px 15px;border-bottom:1px solid var(--border);font-size:14px;color:var(--text-2);vertical-align:middle}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:#FCFDFE}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.t-link{font-size:14px;font-weight:600;color:var(--text)}
.t-link:hover{color:var(--indigo);text-decoration:underline}
.t-sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.t-num{color:var(--indigo);font-weight:600;font-variant-numeric:tabular-nums}
.t-num:hover{text-decoration:underline}
.t-none{color:var(--text-muted)}
td.act{width:48px;text-align:right}

/* menu */
.rowmenu{position:relative;display:inline-block}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-lg);min-width:190px;padding:5px;z-index:70;display:none}
.menu.open{display:block}
.menu button{display:flex;align-items:center;gap:9px;width:100%;padding:8px 10px;border-radius:6px;font-size:13.5px;color:var(--text)}
.menu button:hover{background:var(--bg-soft)}
.menu button.danger{color:var(--red)}
.menu button.danger:hover{background:var(--red-tint)}
.menu hr{border:none;border-top:1px solid var(--border);margin:5px 0}

/* empty state — one component */
.empty{border:1px dashed var(--border-strong);border-radius:var(--r-card);background:#FCFDFE;padding:38px 26px;text-align:center}
.empty .ic-xl{color:var(--text-muted);margin:0 auto 13px}
.empty h3{font-size:16px;font-weight:600;margin-bottom:6px}
.empty p{font-size:14px;color:var(--text-2);max-width:46ch;margin:0 auto 17px}

/* forms */
.field{margin-bottom:17px}
.field:last-child{margin-bottom:0}
.field label{display:block;font-size:13.5px;font-weight:600;color:var(--text);margin-bottom:7px}
.field label .opt{font-weight:400;color:var(--text-muted)}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border-strong);border-radius:var(--r-input);font:inherit;font-size:14.5px;color:var(--text);background:#fff}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.field .help{font-size:12.5px;color:var(--text-muted);margin-top:6px}
.check{display:flex;gap:11px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--border)}
.check:last-child{border-bottom:none}
.check input{width:17px;height:17px;margin-top:2px;accent-color:var(--indigo);flex:none}
.check .lbl{font-size:14px;color:var(--text)}
.check .sub{font-size:12.5px;color:var(--text-muted);margin-top:2px}
.rowline{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--border);font-size:14px}
.rowline:last-child{border-bottom:none}

/* chart */
.chart{position:relative;padding:14px 0 0 46px}
.chart .grid-l{position:absolute;left:46px;right:0;border-top:1px dashed var(--border);font-size:0}
.chart .ylab{position:absolute;left:0;font-size:11px;color:var(--text-muted);font-variant-numeric:tabular-nums;transform:translateY(-50%)}
.bars{display:flex;align-items:flex-end;gap:9px;height:170px;position:relative;border-bottom:1px solid var(--border-strong)}
.bar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%;position:relative}
.bar .fill{background:var(--green);border-radius:3px 3px 0 0;min-height:2px;transition:.2s}
.bar .track{background:var(--bg-soft);border-radius:3px 3px 0 0;height:3px}
.xlabs{display:flex;gap:9px;margin-top:7px}
.xlabs div{flex:1;text-align:center;font-size:11.5px;color:var(--text-muted)}

/* master-detail */
.md{display:grid;grid-template-columns:288px 1fr;gap:18px;align-items:start}
.mdlist{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sm);overflow:hidden;max-height:600px;display:flex;flex-direction:column}
.mdlist .s{padding:11px;border-bottom:1px solid var(--border)}
.mdlist .s .search{width:100%}
.mdrows{overflow-y:auto}
.mdrow{display:flex;align-items:center;gap:10px;padding:10px 13px;border-bottom:1px solid var(--border);width:100%}
.mdrow:hover{background:var(--bg-soft)}
.mdrow.on{background:var(--indigo-tint)}
.mdrow .nm{font-size:14px;font-weight:600;color:var(--text)}
.mdrow .em{font-size:12px;color:var(--text-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mdrow .txt{min-width:0}
.dl{display:grid;grid-template-columns:auto 1fr;gap:9px 20px;font-size:14px}
.dl dt{color:var(--text-2)}
.dl dd{color:var(--text);font-weight:500}
.dl dd.none{color:var(--text-muted);font-weight:400}
.sec-l{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);margin:22px 0 11px}
.sec-l:first-child{margin-top:0}

/* calendar */
.cal{border:1px solid var(--border);border-radius:var(--r-card);overflow:hidden;background:#fff;box-shadow:var(--sh-sm)}
.dows{display:grid;grid-template-columns:repeat(7,1fr);background:var(--bg-soft);border-bottom:1px solid var(--border)}
.dows div{padding:8px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2);text-align:center}
.weeks{display:grid;grid-template-columns:repeat(7,1fr)}
.cell{min-height:96px;border-right:1px solid var(--border);border-bottom:1px solid var(--border);padding:6px}
.cell:nth-child(7n){border-right:none}
.weeks>.cell:nth-last-child(-n+7){border-bottom:none}
.cell.out{background:#FCFDFE}.cell.out .dn{color:var(--text-muted)}
.dn{font-size:12px;font-weight:600;color:var(--text-2);text-align:right;margin-bottom:4px;font-variant-numeric:tabular-nums}
.cell.today .dn{display:inline-flex;float:right;background:var(--amber-dot);color:#3B2A05;width:21px;height:21px;border-radius:50%;align-items:center;justify-content:center;font-size:11.5px}
.ev{display:flex;align-items:center;gap:5px;padding:2px 4px;border-radius:4px;font-size:11.5px;width:100%;margin-bottom:2px;line-height:1.35}
.ev:hover{background:var(--bg-soft)}
.ev .d{width:7px;height:7px;border-radius:50%;flex:none}
.ev .tm{color:var(--text-muted);font-variant-numeric:tabular-nums;flex:none}
.ev .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.ev.canc .nm{text-decoration:line-through;color:var(--text-muted);font-weight:500}
.ev.done .nm{color:var(--text-2);font-weight:500}
.legend{display:flex;gap:15px;flex-wrap:wrap;margin-left:auto}
.leg{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-2);font-weight:500}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

/* chat */
.chatwrap{display:grid;grid-template-columns:1fr 262px;gap:18px;align-items:start}
.sugg-g{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:17px}
.sugg{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:var(--sh-sm)}
.sugg:hover{border-color:var(--indigo);box-shadow:var(--sh-md)}
.sugg .ic{color:var(--indigo);margin-top:1px}
.sugg span{font-size:13.5px;font-weight:500}
.thread{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sm);display:flex;flex-direction:column}
.tbody{padding:18px;display:flex;flex-direction:column;gap:15px;min-height:230px}
.msg{display:flex;gap:10px;max-width:80%}
.msg.me{margin-left:auto;flex-direction:row-reverse}
.bub{background:var(--bg-soft);border:1px solid var(--border);border-radius:12px;padding:10px 13px;font-size:14px;color:var(--text)}
.msg.me .bub{background:var(--indigo-tint);border-color:#DDD6FE}
.ai{width:28px;height:28px;border-radius:50%;background:var(--indigo);color:#fff;display:grid;place-items:center;flex:none}
.ai .ic{width:15px;height:15px}
.srcs{margin-top:9px;padding-top:9px;border-top:1px solid var(--border-strong);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.srcs .l{font-size:11.5px;color:var(--text-muted);font-weight:500}
.src{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--indigo);background:#fff;border:1px solid var(--border-strong);border-radius:999px;padding:3px 9px}
.src:hover{background:var(--indigo-tint)}
.disc{display:flex;gap:8px;padding:10px 14px;background:var(--amber-tint);border-top:1px solid var(--border);font-size:12.5px;color:var(--amber-deep)}
.disc .ic{margin-top:1px;flex:none}
.comp{border-top:1px solid var(--border);padding:11px;display:flex;gap:9px}
.comp textarea{flex:1;border:1px solid var(--border-strong);border-radius:var(--r-input);padding:10px 12px;font:inherit;font-size:14px;resize:none;height:42px}
.comp textarea:focus{outline:none;border-color:var(--indigo);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
.send{width:42px;height:42px;border-radius:var(--r-btn);background:var(--green);color:#fff;display:grid;place-items:center;flex:none}
.send:hover{background:var(--green-hover)}
.hist{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);box-shadow:var(--sh-sm);overflow:hidden}
.hist-h{display:flex;align-items:center;padding:11px 14px;border-bottom:1px solid var(--border)}
.hist-h span{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-2)}
.hist-h button{margin-left:auto;font-size:13px;font-weight:600;color:var(--indigo)}
.hist-g{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--text-muted);padding:11px 14px 4px}
.hist-i{display:block;width:100%;padding:7px 14px;font-size:13.5px}
.hist-i:hover{background:var(--bg-soft)}
.hist-i b{display:block;font-weight:500;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist-i i{font-style:normal;font-size:11.5px;color:var(--text-muted)}

/* ===== design-system page ===== */
.ds-intro{background:linear-gradient(0deg,#fff,#fff);border:1px solid var(--border);border-left:3px solid var(--indigo);border-radius:var(--r-card);padding:20px 22px;margin-bottom:26px;box-shadow:var(--sh-sm)}
.ds-intro h2{font-size:19px;font-weight:700;letter-spacing:-.3px;margin-bottom:8px}
.ds-intro p{font-size:14.5px;color:var(--text-2);max-width:78ch}
.ds-counts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:11px;margin-top:18px}
.ds-count{background:var(--bg-soft);border-radius:9px;padding:12px 14px}
.ds-count b{display:block;font-size:23px;font-weight:700;color:var(--indigo);font-variant-numeric:tabular-nums;line-height:1.1}
.ds-count span{font-size:12.5px;color:var(--text-2);display:block;margin-top:3px}
.spec{background:#fff;border:1px solid var(--border);border-radius:var(--r-card);margin-bottom:20px;box-shadow:var(--sh-sm);overflow:hidden}
.spec-h{padding:15px 20px;border-bottom:1px solid var(--border);display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.spec-h h3{font-size:16px;font-weight:600}
.spec-h .repl{font-size:12px;font-weight:600;color:var(--red-deep);background:var(--red-tint);border-radius:999px;padding:2px 9px}
.spec-h .rule{margin-left:auto;font-size:13px;color:var(--text-2);flex-basis:100%;margin-top:4px}
.spec-b{padding:20px;background:#FCFDFE}
.spec-b.plain{background:#fff}
.demo{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.was{padding:13px 20px;border-top:1px solid var(--border);background:#fff;font-size:13px;color:var(--text-2);display:flex;gap:9px;align-items:flex-start}
.was b{color:var(--red-deep);font-weight:600;flex:none}
.maptbl{width:100%;font-size:13.5px;border-collapse:collapse}
.maptbl td{padding:7px 0;border-bottom:1px solid var(--border);vertical-align:middle}
.maptbl tr:last-child td{border-bottom:none}
.maptbl td:first-child{width:150px}
.maptbl td:last-child{color:var(--text-2)}

@media(max-width:1100px){.chatwrap,.md{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){.side{display:none}.content{padding:18px 15px 40px}}
</style>

<script>
/* ---------------- nav ---------------- */
var NAV=[
  {g:'Prototype',items:[{k:'ds',n:'Design system',i:'i-layers',ds:1}]},
  {g:'Assistant',items:[{k:'ask',n:'Ask Chat',i:'i-spark'}]},
  {g:'People',items:[{k:'people',n:'People',i:'i-users'},{k:'approvals',n:'Member approval',i:'i-usercheck',cnt:3},{k:'groups',n:'Groups',i:'i-groups'}]},
  {g:'Engage',items:[{k:'forms',n:'Forms',i:'i-clip'},{k:'campaigns',n:'Campaigns',i:'i-mega'},{k:'files',n:'Files',i:'i-folder',tag:'NEW'}]},
  {g:'Operate',items:[{k:'calendar',n:'Calendar',i:'i-cal'},{k:'tasks',n:'Tasks',i:'i-check'},{k:'workflows',n:'Workflows',i:'i-zap'}]},
  {g:'Money',items:[{k:'finances',n:'Finances',i:'i-wallet'},{k:'reporting',n:'Reporting',i:'i-chart'}]},
  {g:'Operations',items:[{k:'settings',n:'Settings',i:'i-settings'},{k:'vendors',n:'Vendors',i:'i-building'},{k:'integrations',n:'Integrations',i:'i-plug'}]}
];
var cur='ds';
function renderNav(){
  document.getElementById('nav').innerHTML=NAV.map(function(g){
    return '<div class="nav-label">'+g.g+'</div>'+g.items.map(function(it){
      var right = it.cnt?'<span class="cnt">'+it.cnt+'</span>' : (it.tag?'<span class="tag">'+it.tag+'</span>':'');
      return '<button class="nav-item'+(it.ds?' ds':'')+(it.k===cur?' active':'')+'" onclick="go(\''+it.k+'\')">'+
        '<svg class="ic"><use href="#'+it.i+'"/></svg>'+it.n+right+'</button>';
    }).join('');
  }).join('');
}
function label(k){var r='';NAV.forEach(function(g){g.items.forEach(function(i){if(i.k===k)r=i.n})});return r}
function go(k){cur=k;renderNav();document.getElementById('ptitle').textContent=label(k);
  document.getElementById('content').innerHTML=PAGES[k]?PAGES[k]():stub(k);closeMenus();window.scrollTo(0,0)}
function closeMenus(){document.querySelectorAll('.menu.open').forEach(function(m){m.classList.remove('open')})}
function menu(b,e){e.stopPropagation();var m=b.nextElementSibling,w=m.classList.contains('open');closeMenus();if(!w)m.classList.add('open')}
document.addEventListener('click',closeMenus);

/* ---------------- helpers ---------------- */
function head(sub,acts){return '<div class="phead"><p>'+sub+'</p>'+(acts?'<div class="acts">'+acts+'</div>':'')+'</div>'}
function pbtn(t){return '<button class="btn btn-primary"><svg class="ic ic-sm"><use href="#i-plus"/></svg>'+t+'</button>'}
function sbtn(t,ic){return '<button class="btn btn-secondary">'+(ic?'<svg class="ic ic-sm"><use href="#'+ic+'"/></svg>':'')+t+'</button>'}
function search(ph){return '<div class="search"><svg class="ic ic-sm"><use href="#i-search"/></svg><input placeholder="'+ph+'"></div>'}
function rowmenu(items){
  return '<div class="rowmenu"><button class="icon-btn" onclick="menu(this,event)" aria-label="Row actions"><svg class="ic"><use href="#i-more"/></svg></button><div class="menu">'+
    items.map(function(i){return i==='-'?'<hr>':'<button class="'+(i[2]?'danger':'')+'"><svg class="ic ic-sm"><use href="#'+i[1]+'"/></svg>'+i[0]+'</button>'}).join('')+'</div></div>';
}
function empty(icon,title,body,action){
  return '<div class="empty"><svg class="ic ic-xl"><use href="#'+icon+'"/></svg><h3>'+title+'</h3><p>'+body+'</p>'+(action?pbtn(action):'')+'</div>';
}
function stub(k){return head('This module uses the same header, toolbar, table, badge and empty-state components shown on the Design system page.','')+
  empty('i-layers',label(k),'Not rebuilt in this prototype — it inherits the shared components rather than defining its own.','')}

/* ---------------- pages ---------------- */
var PAGES={};

PAGES.ds=function(){
  return ''+
  '<div class="ds-intro"><h2>One system, applied to every module</h2>'+
  '<p>Fifteen screens were audited. The components below each replace a set of one-off treatments that had drifted apart — same job, different markup, on different pages. Every module in this sidebar is rebuilt on them; click through to see the result.</p>'+
  '<div class="ds-counts">'+
    '<div class="ds-count"><b>6</b><span>status treatments → 1 badge</span></div>'+
    '<div class="ds-count"><b>5</b><span>empty states → 1 component</span></div>'+
    '<div class="ds-count"><b>4</b><span>search inputs → 1</span></div>'+
    '<div class="ds-count"><b>4</b><span>create verbs → 1 rule</span></div>'+
    '<div class="ds-count"><b>14</b><span>duplicated page titles → 0</span></div>'+
  '</div></div>'+

  spec('Page header','Every page','Top bar carries the title. Content opens with a one-sentence subhead and the primary action on the right. No second H1.',
    '<div class="phead" style="margin:0"><p>Volunteer teams, small groups, and ministries.</p><div class="acts">'+sbtn('Export')+pbtn('New group')+'</div></div>',
    'Title printed twice on all 14 pages. Subhead on 8 of 14. Tasks put its subhead to the right of the H1. Page title differed from the nav label on Tasks ("Scheduled tasks") and Reporting ("Reporting Dashboard").')+

  spec('Buttons','4 verbs → 1 rule','<b>New &lt;thing&gt;</b> creates a record. <b>Import / Upload / Export</b> move files. Sentence case. One primary per region; destructive is never a sibling of a safe action.',
    '<div class="demo">'+pbtn('New group')+sbtn('Import CSV','i-up')+'<button class="btn btn-ghost">Cancel</button><button class="btn btn-danger"><svg class="ic ic-sm"><use href="#i-trash"/></svg>Delete group</button></div>',
    '"+ New Event", "+ Create form", "+ Add Vendor", "+ Upload file" — four verbs, two casings. Import CSV was a bordered button on Finances and bare text on People. Delete sat flush beside Members on the Groups card.')+

  spec('Three switchers, three jobs','3 components','Tabs switch <b>sections of one page</b>. Segmented switches <b>the view of one dataset</b>. Chips <b>narrow a set</b>. Never swap them.',
    '<div style="display:flex;flex-direction:column;gap:16px">'+
      '<div><div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:7px">TABS — sections</div>'+
      '<div class="tabs" style="margin:0"><button class="on">Bank</button><button>Donations</button><button>Budget</button></div></div>'+
      '<div><div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:7px">SEGMENTED — view</div>'+
      '<div class="seg"><button class="on">Month</button><button>Week</button><button>Day</button><button>List</button></div></div>'+
      '<div><div style="font-size:12px;font-weight:600;color:var(--text-muted);margin-bottom:7px">CHIPS — filter</div>'+
      '<div class="chips"><button class="chip on">All</button><button class="chip">Active</button><button class="chip">Inactive</button></div></div>'+
    '</div>',
    'All three already existed but the mapping was accidental: green underline tabs on Settings/Finances/People, a dark segmented control on Calendar, bordered rectangles on Vendors. Tab active state moved from green to indigo so green stays exclusively "commits a change".')+

  spec('Status badge','6 treatments → 1','One pill. Six meanings, fixed. Status is never plain coloured text and never bare uppercase.',
    '<table class="maptbl">'+
    badgerow('b-live','Published','Live, active, approved')+
    badgerow('b-draft','Draft','Not yet live, inactive')+
    badgerow('b-attn','Pending','Needs a person to act')+
    badgerow('b-info','Weekly','Scheduled or informational')+
    badgerow('b-stop','Cancelled','Stopped, failed, disconnected')+
    badgerow('b-done','Archived','Finished, no longer in play')+
    '</table>',
    'Green pill (Forms), yellow pill (Campaigns DRAFT), bare uppercase grey (Campaigns ARCHIVED — same column), purple pill (Tasks Weekly), plain green text (Tasks Active), plain grey text (Settings Disconnected).')+

  spec('Empty state','5 treatments → 1','Icon, what belongs here, one sentence on what to do, and the action. Copy never quotes a button label back at the reader.',
    empty('i-building','No vendors yet','Add the contractors and suppliers your church works with, so work orders and invoices have somewhere to attach.','New vendor'),
    'Centred card (Vendors), centred card ×2 with copy quoting the button (Files), bare unboxed text (Workflows), left-aligned full-width box (Member approval), a table row (Finances). None offered an action.')+

  spec('Table','Mixed → 1','Identifying column is the link. Counts link to what they count. Numbers right-aligned and tabular. Money always carries symbol and two decimals. One overflow menu, far right.',
    '<div class="tblw"><table><thead><tr><th style="width:44%">Form</th><th>Status</th><th class="num">Responses</th><th>Created</th><th></th></tr></thead><tbody>'+
    '<tr><td><a class="t-link" href="#" onclick="return false">Usher Signup for Sunday</a><div class="t-sub">Sign up to be an usher this Sunday.</div></td>'+
    '<td><span class="badge b-live">Published</span></td><td class="num"><a class="t-num" href="#" onclick="return false">2</a></td><td>Aug 7, 2026</td>'+
    '<td class="act">'+rowmenu([['Copy share link','i-link'],['Edit form','i-edit'],'-',['Archive form','i-trash',1]])+'</td></tr>'+
    '</tbody></table></div>',
    'Link colour was blue on Forms and indigo on Campaigns. Row actions were Pause|Edit|Delete text links on Tasks, an "Open" button on Campaigns, and nothing at all on Forms. The created date was the only link on the Forms table; the name and the response count were dead text.')+

  spec('Stat tiles','8 per page → 4 max','Label above, figure below, delta carries the colour. Never colour the figure itself. One row, four maximum — past that it stops being a summary.',
    '<div class="grid g4">'+
      stat('Total members','142','<span class="up">+6</span> in the last 30 days')+
      stat('Avg Sunday attendance','96','<span class="up">+4.3%</span> this quarter')+
      stat('Giving YTD','$312,480','<span class="up">+6.2%</span> vs. last year')+
      stat('Pending approvals','3','oldest waiting 4 days')+
    '</div>',
    'Reporting carried 8 tiles across two rows with two different internal layouts. Finances rendered $0.00 in giant green and red. Colouring the figure means a large negative number and a large positive one shout equally loudly.')+

  spec('Search','4 inputs → 1','Bordered, 8px radius, leading magnifier, placeholder names what is being searched. Lives in a toolbar row above the content.',
    '<div class="toolbar" style="margin:0">'+search('Search forms…')+'<button class="btn btn-secondary btn-sm">All statuses</button></div>',
    'Bordered with an inset icon (Forms), bordered with no icon (Vendors), bordered with a permanent outline ring (Files), and borderless with only a bottom rule (People).')+

  spec('Chart','Broken → readable','Axis, gridlines, and a scale. Zero months render as an empty track sitting on the baseline, not a hairline that reads as a rendering fault.',
    chart(),
    'The Giving by Month chart had no axis, no gridlines and no scale, so twelve $0 months rendered as twelve thin green lines — indistinguishable from a broken component.')+

  spec('Content rules','Naming','Page title equals the nav label. One name for the assistant. Empty values say what is missing, never "--".',
    '<table class="maptbl">'+

function chart(){
  var m=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  var v=[38200,35900,41100,37400,33800,31200,48312,29050,0,0,0,0];
  var max=50000;
  var bars=v.map(function(x){
    if(!x) return '<div class="bar"><div class="track"></div></div>';
    return '<div class="bar"><div class="fill" style="height:'+Math.round(x/max*100)+'%"></div></div>';
  }).join('');
  var lines=[0,25,50,75,100].map(function(p){var y=p/100*170+24;
    return '<div class="grid-l" style="bottom:'+y+'px"></div><div class="ylab" style="bottom:'+y+'px">$'+(max*p/100/1000)+'k</div>';
  }).join('');
  return '<div class="card card-pad"><div style="font-size:15px;font-weight:600;margin-bottom:4px">Giving by month</div>'+
    '<div style="font-size:13px;color:var(--text-2);margin-bottom:14px">2026 to date · September onward not yet recorded</div>'+
    '<div class="chart">'+lines+'<div class="bars">'+bars+'</div><div class="xlabs">'+m.map(function(x){return '<div>'+x+'</div>'}).join('')+'</div></div></div>';
}
